                        - paragraph [ref=f205e326]:
                          - strong [ref=f205e1017]: Manufacturing Engineer
                          - strong [ref=f205e1019]: Position Overview
                          - text: We are seeking a Manufacturing Engineer to develop, optimize, and sustain production equipment and processes for vacuum and semiconductor-related manufacturing. The role focuses on designing and qualifying equipment (including vacuum chambers), improving manufacturability and throughput, ensuring compliance with NRTL and SEMI S2/S8 safety standards, and collaborating with cross-functional teams to bring robust, production-ready systems online.
                          - strong [ref=f205e1021]: Key Responsibilities
                          - list [ref=f205e1023]:
                            - listitem [ref=f205e1024]: Design, develop, and validate manufacturing equipment and fixtures with emphasis on vacuum systems and vacuum chambers.
                            - listitem [ref=f205e1025]: Create detailed mechanical and cable designs and producibility documentation to support manufacturing and assembly.
                            - listitem [ref=f205e1026]: Perform finite element analysis (FEA) and other engineering studies to ensure structural integrity and performance of equipment.
                            - listitem [ref=f205e1027]: Develop and maintain control logic interfaces and work with PLC engineers to integrate automation with production equipment.
                            - listitem [ref=f205e1028]: Lead design for compliance with safety and certification standards (NRTL, SEMI S2/S8) and prepare documentation for safety reviews and audits.
                            - listitem [ref=f205e1029]: Work with suppliers and internal teams to source components, perform incoming inspections, and resolve manufacturing issues.
                            - listitem [ref=f205e1030]: Drive continuous improvement initiatives to reduce cost, increase yield, and improve equipment uptime and serviceability.
                            - listitem [ref=f205e1031]: Prepare work instructions, bills of materials, and production validation plans; support installation, commissioning, and field support activities.
                          - strong [ref=f205e1033]: Qualifications
                          - list [ref=f205e1035]:
                            - listitem [ref=f205e1036]: Bachelors degree in Mechanical, Manufacturing, Electrical Engineering, or related field required; Masters degree preferred.
                            - listitem [ref=f205e1037]: 3+ years of experience in manufacturing engineering, equipment design, or a related role, preferably in vacuum systems or semiconductor equipment.
                            - listitem [ref=f205e1038]: Hands-on experience with vacuum systems and vacuum chamber design and commissioning.
                            - listitem [ref=f205e1039]: Proven experience with equipment design, cable design, and creating manufacturable assemblies and documentation.
                            - listitem [ref=f205e1040]: Familiarity with safety and certification processes including NRTL and SEMI S2/S8 standards.
                            - listitem [ref=f205e1041]: Experience with PLC integration and control system coordination with manufacturing equipment.
                            - listitem [ref=f205e1042]: Proficiency in FEA tools (ANSYS, SolidWorks Simulation, or equivalent) and CAD software (SolidWorks, Creo, etc.).
                            - listitem [ref=f205e1043]: Strong problem-solving skills, excellent written and verbal communication, and experience working in cross-functional teams.
                            - listitem [ref=f205e1044]: Ability to travel for supplier visits, installations, and field support as needed.
