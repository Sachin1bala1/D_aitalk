                    - paragraph [ref=e329]:
                      - generic [ref=e330]:
                        - strong [ref=e331]: Manufacturing Engineer
                        - strong [ref=e332]: Position Overview
                        - text: We are seeking a Manufacturing Engineer to develop, optimize, and sustain production equipment and processes for vacuum and semiconductor-related manufacturing. The role focuses on designing and qualifying equipment (including vacuum chambers), improving manufacturability and throughput, ensuring compliance with NRTL and SEMI S2/S8 safety standards, and collaborating with cross-functional teams to bring robust, production-ready systems online.
                        - strong [ref=e333]: Key Responsibilities
                        - list [ref=e334]:
                          - listitem [ref=e335]: Design, develop, and validate manufacturing equipment and fixtures with emphasis on vacuum systems and vacuum chambers.
                          - listitem [ref=e336]: Create detailed mechanical and cable designs and producibility documentation to support manufacturing and assembly.
                          - listitem [ref=e337]: Perform finite element analysis (FEA) and other engineering studies to ensure structural integrity and performance of equipment.
                          - listitem [ref=e338]: Develop and maintain control logic interfaces and work with PLC engineers to integrate automation with production equipment.
                          - listitem [ref=e339]: Lead design for compliance with safety and certification standards (NRTL, SEMI S2/S8) and prepare documentation for safety reviews and audits.
                          - listitem [ref=e340]: Work with suppliers and internal teams to source components, perform incoming inspections, and resolve manufacturing issues.
                          - listitem [ref=e341]: Drive continuous improvement initiatives to reduce cost, increase yield, and improve equipment uptime and serviceability.
                          - listitem [ref=e342]: Prepare work instructions, bills of materials, and production validation plans; support installation, commissioning, and field support activities.
                        - strong [ref=e343]: Qualifications
                        - list [ref=e344]:
                          - listitem [ref=e345]: Bachelors degree in Mechanical, Manufacturing, Electrical Engineering, or related field required; Masters degree preferred.
                          - listitem [ref=e346]: 3+ years of experience in manufacturing engineering, equipment design, or a related role, preferably in vacuum systems or semiconductor equipment.
                          - listitem [ref=e347]: Hands-on experience with vacuum systems and vacuum chamber design and commissioning.
                          - listitem [ref=e348]: Proven experience with equipment design, cable design, and creating manufacturable assemblies and documentation.
                          - listitem [ref=e349]: Familiarity with safety and certification processes including NRTL and SEMI S2/S8 standards.
                          - listitem [ref=e350]: Experience with PLC integration and control system coordination with manufacturing equipment.
                          - listitem [ref=e351]: Proficiency in FEA tools (ANSYS, SolidWorks Simulation, or equivalent) and CAD software (SolidWorks, Creo, etc.).
                          - listitem [ref=e352]: Strong problem-solving skills, excellent written and verbal communication, and experience working in cross-functional teams.
                          - listitem [ref=e353]: Ability to travel for supplier visits, installations, and field support as needed.
