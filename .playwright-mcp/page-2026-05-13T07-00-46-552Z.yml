            - generic [ref=e50]:
              - strong [ref=e51]: This position is posted by Jobgether on behalf of a partner company. We are currently looking for a Senior Process Excellence Engineer/AI Coordinator in United States.
              - text: This is a unique opportunity for a highly strategic and innovative professional to lead enterprise-wide operational transformation initiatives while driving the integration of AI-enabled continuous improvement solutions. In this role, you will collaborate across Operations, Finance, HR, Procurement, Accounting, and Technology teams to optimize processes, eliminate inefficiencies, and enhance organizational performance. You’ll combine deep Lean expertise with emerging AI capabilities to design scalable transformation programs and intelligent automation strategies. The position offers strong visibility across the organization and the chance to influence long-term operational excellence initiatives at a global scale. You will work in a collaborative, fast-paced environment focused on innovation, measurable business impact, and continuous learning. This role is ideal for someone who thrives at the intersection of process optimization, strategic leadership, and advanced technology adoption.
              - strong [ref=e52]: Accountabilities
              - list [ref=e53]:
                - listitem [ref=e54]: Lead enterprise-wide Lean transformation initiatives across multiple business functions, including Operations, Finance, HR, Accounting, Procurement, and Technology.
                - listitem [ref=e55]: Facilitate value stream mapping sessions, Kaizen events, rapid improvement workshops, and structured problem-solving initiatives using methodologies such as DMAIC, A3, and 8D.
                - listitem [ref=e56]: Identify, prototype, and coordinate AI-enabled process improvement opportunities using intelligent automation, machine learning, and agentic AI solutions.
                - listitem [ref=e57]: Manage a portfolio of process excellence and AI transformation projects, ensuring alignment with strategic objectives, timelines, budgets, and stakeholder expectations.
                - listitem [ref=e58]: Develop project roadmaps, KPIs, communication plans, and governance frameworks to monitor transformation success and sustain long-term improvements.
                - listitem [ref=e59]: Collaborate with IT, Data, and Digital teams to ensure AI integrations align with enterprise architecture, compliance, and governance standards.
                - listitem [ref=e60]: Coach and mentor cross-functional teams and leadership on Lean principles, operational excellence practices, and continuous improvement culture.
                - listitem [ref=e61]: Create documentation, training materials, playbooks, and standard operating procedures to institutionalize process excellence capabilities throughout the organization.
                - listitem [ref=e62]: Present project outcomes, risks, and business impact updates to senior leadership and executive stakeholders.
              - strong [ref=e63]: Requirements
              - list [ref=e64]:
                - listitem [ref=e65]: 5-10+ years of experience in process excellence, operational transformation, or continuous improvement leadership roles.
                - listitem [ref=e66]: Proven expertise leading large-scale Lean transformation initiatives across enterprise functions and geographically distributed teams.
                - listitem [ref=e67]: Lean certification and/or Six Sigma Black Belt (LSSBB) certification required; Master Black Belt (MBB) strongly preferred.
                - listitem [ref=e68]: Strong experience facilitating cross-functional collaboration and influencing stakeholders without direct authority.
                - listitem [ref=e69]: Hands-on experience with AI technologies such as large language models, intelligent automation frameworks, or MLOps platforms.
                - listitem [ref=e70]: Knowledge of Lean management systems, KPI frameworks, and operational performance methodologies.
                - listitem [ref=e71]: Experience working with ERP systems such as SAP, Oracle, or similar enterprise platforms.
                - listitem [ref=e72]: Strong project and portfolio management capabilities with familiarity in Agile, hybrid, or PMI methodologies.
                - listitem [ref=e73]: Excellent communication, facilitation, analytical, and strategic problem-solving skills.
                - listitem [ref=e74]: Bachelor’s or Master’s degree preferred.
                - listitem [ref=e75]: Ability to travel frequently in support of transformation initiatives and AI deployment activities.
              - strong [ref=e76]: Benefits
              - list [ref=e77]:
                - listitem [ref=e78]: Competitive salary range of $140,000 - $150,000 annually
                - listitem [ref=e79]: Eligibility for annual performance-based incentive compensation
                - listitem [ref=e80]: Fully remote work environment with enterprise-level collaboration opportunities
                - listitem [ref=e81]: Exposure to cutting-edge AI and intelligent automation initiatives
                - listitem [ref=e82]: Career growth opportunities within a highly innovative and transformation-focused organization
                - listitem [ref=e83]: Opportunity to lead large-scale enterprise process excellence programs
                - listitem [ref=e84]: Collaborative and inclusive workplace culture
                - listitem [ref=e85]: Comprehensive health, wellness, and employee support programs
                - listitem [ref=e86]: Flexible and dynamic work environment with high-impact responsibilities
              - strong [ref=e87]: How Jobgether Works
              - text: We use an
              - strong [ref=e88]: AI-powered matching process
              - text: to ensure your application is reviewed quickly, objectively, and fairly against the role's core requirements. Our system identifies the top-fitting candidates, and this shortlist is then shared directly with the hiring company. The final decision and next steps (interviews, assessments) are managed by their internal team.
              - text: We appreciate your interest and wish you the best!
              - text: Why Apply Through Jobgether?
              - strong [ref=e89]: "Data Privacy Notice:"
              - text: By submitting your application, you acknowledge that Jobgether will process your personal data to evaluate your candidacy and share relevant information with the hiring employer. This processing is based on legitimate interest and pre-contractual measures under applicable data protection laws (including GDPR). You may exercise your rights (access, rectification, erasure, objection) at any time.
              - text: We may use artificial intelligence (AI) tools to support parts of the hiring process, such as reviewing applications, analyzing resumes, or assessing responses. These tools assist our recruitment team but do not replace human judgment. Final hiring decisions are ultimately made by humans. If you would like more information about how your data is processed, please contact us.
