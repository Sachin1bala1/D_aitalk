        - generic [ref=e56]:
          - generic [ref=e58]:
            - generic [ref=e59]:
              - strong [ref=e60]: WHAT YOU DO AT AMD CHANGES EVERYTHING
              - text: At AMD, our mission is to build great products that accelerate next-generation computing experiences—from AI and data centers, to PCs, gaming and embedded systems. Grounded in a culture of innovation and collaboration, we believe real progress comes from bold ideas, human ingenuity and a shared passion to create something extraordinary. When you join AMD, you’ll discover the real differentiator is our culture. We push the limits of innovation to solve the world’s most important challenges—striving for execution excellence, while being direct, humble, collaborative, and inclusive of diverse perspectives. Join us as we shape the future of AI and beyond.
              - strong [ref=e61]: Together, we advance your career.
              - strong [ref=e62]: THE ROLE
              - text: As an Enterprise Product Development Engineer – Data & Yield Analysis, you will play a key role in driving data‑informed decisions across next‑generation AMD microprocessors. This position sits within Product Engineering and spans New Product Introduction (NPI) through production, with a strong emphasis on yield learning, characterization interpretation, and test‑point strategy.
              - text: This is an analysis‑centric role. A significant portion of the job (perhaps 40-50%) involves working directly with large, imperfect silicon test and yield datasets—extracting meaningful signals from complex, non‑curated data files and translating that data into clear conclusions, risk assessments, and recommended actions for engineering teams and leadership.
              - text: This role offers meaningful technical visibility and impact, and is best suited for engineers who enjoy hands‑on analysis, fast learning cycles, and using data to drive real decisions, rather than building large data platforms or test programs.
              - emphasis [ref=e63]: This role is based on‑site in Austin, TX.
              - strong [ref=e64]: THE PERSON
              - text: You are an engineer who enjoys working with real‑world engineering data, including datasets that are incomplete, noisy, or imperfect. You are comfortable asking the right questions, validating assumptions, and standing behind conclusions with sound reasoning and statistics.
              - text: You balance speed and rigor, understand tradeoffs, and communicate clearly with engineers and managers. You are comfortable working in environments where priorities evolve, projects shift, and analysis is often needed quickly to enable decisions.
              - strong [ref=e65]: Key Responsibilities
              - list [ref=e66]:
                - listitem [ref=e67]: Analyze large‑scale silicon test and yield data across NPI and production phases.
                - listitem [ref=e68]: Extract relevant data from broad, catch‑all test files and databases, often requiring custom parsing and validation.
                - listitem [ref=e69]: Drive yield improvement plans and yield loss root‑cause analysis, identifying actionable drivers.
                - listitem [ref=e70]: Define, evaluate, and validate ATE test points using statistical methods, including margin analysis and voltage guardbanding.
                - listitem [ref=e71]: Interpret silicon characterization data from test content such as Scan, MBIST, CReST, and HSIO tests, accounting for frequency, process corners, and operating conditions.
                - listitem [ref=e72]: Communicate analysis results, risks, and recommendations clearly to cross‑functional teams.
                - listitem [ref=e73]: Collaborate with Design, Diagnostics, Test, Foundry Technology, Supply Chain, and other engineering teams to resolve product‑level issues.
                - listitem [ref=e74]: Develop scripts, workflows, and lightweight tools that improve analysis speed and repeatability.
              - strong [ref=e75]: Required Skills
              - list [ref=e76]:
                - listitem [ref=e77]: Experience analyzing complex engineering datasets and driving conclusions from data.
                - listitem [ref=e78]: Solid understanding of statistical analysis techniques (e.g., distributions, correlations, Pareto analysis, margin assessment).
                - listitem [ref=e79]: Experience working with silicon test, yield, or characterization data.
                - listitem [ref=e80]: Proficiency in Python, JSL, Snowflake, or similar, using code for data extraction and analysis.
                - listitem [ref=e81]: Comfort working directly with large, non‑curated datasets.
                - listitem [ref=e82]: Strong written and verbal communication skills.
                - listitem [ref=e83]: Ability to work effectively in fast‑paced, evolving environments.
              - strong [ref=e84]: Preferred Experience
              - list [ref=e85]:
                - listitem [ref=e86]: Yield learning or yield improvement experience in a semiconductor environment.
                - listitem [ref=e87]: Familiarity with ATE test environments (analysis‑focused rather than test‑program development).
                - listitem [ref=e88]: Experience with Dataiku, Snowflake, JMP, or similar tools.
                - listitem [ref=e89]: Background in Electrical Engineering, Computer Engineering, Physics, or a related quantitative discipline.
              - strong [ref=e90]: ACADEMIC CREDENTIALS
              - text: B.S. in Engineering or Physics required.
              - text: Advanced degrees welcome.
              - strong [ref=e91]: LOCATION
              - list [ref=e92]:
                - listitem [ref=e93]: Austin, Texas
              - strong [ref=e94]: This role is not eligible for Visa sponsorship
              - emphasis [ref=e95]: "Benefits offered are described:"
              - text: AMD benefits at a glance.
              - emphasis [ref=e96]: AMD does not accept unsolicited resumes from headhunters, recruitment agencies, or fee-based recruitment services. AMD and its subsidiaries are equal opportunity, inclusive employers and will consider all applicants without regard to age, ancestry, color, marital status, medical condition, mental or physical disability, national origin, race, religion, political and/or third-party affiliation, sex, pregnancy, sexual orientation, gender identity, military or veteran status, or any other characteristic protected by law. We encourage applications from all qualified candidates and will accommodate applicants’ needs under the respective laws throughout all stages of the recruitment and selection process.
              - emphasis [ref=e97]: AMD may use Artificial Intelligence to help screen, assess or select applicants for this position. AMD’s “Responsible AI Policy” is available here.
              - emphasis [ref=e98]: This posting is for an existing vacancy.
