        - generic [ref=e54]:
          - generic [ref=e56]:
            - generic [ref=e57]:
              - text: At Meta, we’re building the future of human connection and the technology that enables it. This means continuously inventing and developing technologies for the next generation of experiences. To continue our efforts in the path to AGI, and as we move closer to a future with intelligent robots and advanced AI models, we're hiring talent across a broad range of disciplines from robotics hardware to system software, machine perception, and artificial intelligence. These crucial projects and initiatives taken on by this team have never been done before, so you have a rare opportunity to help us create new ways people connect around the world. Meta Robotics Studio is seeking a highly skilled and experienced Prototype Process Engineer to join our team. As a Prototype Process Engineer, you will be responsible for supporting a cross-functional product design team, focusing on hands-on assembly, process development, and prototype build setup. You will act as a key liaison between design intent and scaling production.
              - text: "Prototype Process Engineer Responsibilities:"
              - list [ref=e58]:
                - listitem [ref=e59]: Support a cross-functional product design team with hands-on assembly
                - listitem [ref=e60]: Develop process flows and quality work instructions for prototype builds
                - listitem [ref=e61]: Identify fixturing and tooling needs for prototype assembly
                - listitem [ref=e62]: Setup and manage prototype builds from start to finish
                - listitem [ref=e63]: Work embedded with engineering teams during initial unit builds to ensure design intent is maintained and to facilitate updates to the scale line
                - listitem [ref=e64]: Act as the conduit for design intent and updates between engineering and the scale line
                - listitem [ref=e65]: Support troubleshooting and field service questions for downstream issues
                - listitem [ref=e66]: Serve as the primary point of contact for issues found by users
                - listitem [ref=e67]: Coordinate with cross-functional teams to ensure alignment and collaboration
                - listitem [ref=e68]: Ensure compliance with company policies, procedures, and standards
                - listitem [ref=e69]: Identify opportunities for process improvements and implement changes to increase efficiency and effectiveness
              - text: "Minimum Qualifications:"
              - list [ref=e70]:
                - listitem [ref=e71]: BS or MS degree in engineering or related field, or equivalent experience
                - listitem [ref=e72]: 5+ years of experience in consumer electronic products
                - listitem [ref=e73]: Experience with hardware development cycle and sustaining hardware
                - listitem [ref=e74]: Experience in manufacturing assembly and test development
              - text: "Preferred Qualifications:"
              - list [ref=e75]:
                - listitem [ref=e76]: Demonstrated ability to integrate AI tools to optimize/redesign workflows and drive measurable impact (e.g., efficiency gains, quality improvements)
                - listitem [ref=e77]: Experience adhering to and implementing responsible, ethical AI practices (e.g., risk assessment, bias mitigation, quality and accuracy reviews)
                - listitem [ref=e78]: Demonstrated ongoing AI skill development (e.g., prompt/context engineering, agent orchestration) and staying current with emerging AI technologies
                - listitem [ref=e79]: Experience optimizing design of existing products or devices
                - listitem [ref=e80]: Experience with optical electro-mechanical systems
                - listitem [ref=e81]: Experience with building cross-functional relationships
                - listitem [ref=e82]: Experience with driving for results, motivation, and urgency
              - text: "About Meta:"
              - text: Meta builds technologies that help people connect, find communities, and grow businesses. When Facebook launched in 2004, it changed the way people connect. Apps like Messenger, Instagram and WhatsApp further empowered billions around the world. Now, Meta is moving beyond 2D screens toward immersive experiences like augmented and virtual reality to help build the next evolution in social technology. People who choose to build their careers by building with us at Meta help shape a future that will take us beyond what digital connection makes possible today—beyond the constraints of screens, the limits of distance, and even the rules of physics.
              - text: Meta is proud to be an Equal Employment Opportunity and Affirmative Action employer. We do not discriminate based upon race, religion, color, national origin, sex (including pregnancy, childbirth, or related medical conditions), sexual orientation, gender, gender identity, gender expression, transgender status, sexual stereotypes, age, status as a protected veteran, status as an individual with a disability, or other applicable legally protected characteristics. We also consider qualified applicants with criminal histories, consistent with applicable federal, state and local law. Meta participates in the E-Verify program in certain locations, as required by law. Please note that Meta may leverage artificial intelligence and machine learning technologies in connection with applications for employment.
              - text: Meta is committed to providing reasonable accommodations for candidates with disabilities in our recruiting process. If you need any assistance or accommodations due to a disability, please let us know at accommodations-ext@meta.com.
              - text: $173,000/year to $245,000/year + bonus + equity + benefits
              - text: Individual compensation is determined by skills, qualifications, experience, and location. Compensation details listed in this posting reflect the base hourly rate, monthly rate, or annual salary only, and do not include bonus, equity or sales incentives, if applicable. In addition to base compensation, Meta offers benefits. Learn more about benefits at Meta.
