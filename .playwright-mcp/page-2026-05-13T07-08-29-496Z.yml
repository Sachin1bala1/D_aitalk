          - generic [ref=e51]:
            - generic [ref=e52]:
              - text: "Onto Innovation is a leader in process control, combining global scale with an expanded portfolio of leading-edge technologies that include: 3D metrology spanning the chip from nanometer-scale transistors to micron-level die-interconnects; macro defect inspection of wafers and packages; metal interconnect composition; factory analytics; and lithography for advanced semiconductor packaging. Our breadth of offerings across the entire semiconductor value chain helps our customers solve their most difficult yield, device performance, quality, and reliability issues. Onto Innovation strives to optimize customers’ critical path of progress by making them smarter, faster and more efficient."
              - strong [ref=e53]: Job Summary & Responsibilities
              - text: Junior AI Engineer
              - strong [ref=e54]: "Team:"
              - text: You’ll partner closely with our AI Lead Engineer and collaborate with field/service engineers who support our
              - strong [ref=e55]: inspection & metrology
              - text: tools across fabs.
              - strong [ref=e56]: "Goal:"
              - text: Build practical AI helpers that speed up tasks from
              - strong [ref=e57]: recipe setup
              - text: and
              - strong [ref=e58]: troubleshooting
              - text: to
              - strong [ref=e59]: fleet management analytics
              - text: and
              - strong [ref=e60]: expert guidance
              - text: from internal knowledge.
              - strong [ref=e61]: About Us
              - text: Onto Innovation is a worldwide leader in the design, development, manufacture and support of defect inspection, advanced packaging lithography, process control metrology, and data analysis systems and software used by semiconductor device manufacturers worldwide. Onto Innovation provides a full-fab solution through its families of proprietary products that provide critical yield-enhancing information and real time process control responses, enabling microelectronic device manufacturers to drive down the costs and time to market of their products. The Company’s expanding portfolio of equipment and software solutions is used in both the wafer processing and final manufacturing of ICs, and in adjacent markets such as FPD, and LED manufacturing.
              - text: What you’ll do
              - list [ref=e62]:
                - listitem [ref=e63]: "Prototype AI assistants & agents for field workflows: guided recipe setup, log triage, playbook lookups, parts/alarms advice, and fleet-wide health checks."
                - listitem [ref=e64]: "Build retrieval systems (RAG): ingest manuals, specs, ticket notes, recipes, logs, and best-practice docs; design chunking, embeddings, and indexing; tune prompts and retrieval for accuracy/latency."
                - listitem [ref=e65]: "Connect AI to our tools and data: stand up MCP servers (Model Context Protocol) and other connectors to safely expose internal systems (document stores, MES, issue trackers, telemetry APIs) to LLMs."
                - listitem [ref=e66]: Fine-tune or adapt models (e.g., LoRA/QLoRA) for domain terms, error codes, and tool-specific intents when retrieval alone isn’t enough.
                - listitem [ref=e67]: "Evaluate and harden: set up offline & online evals for groundedness/relevance; add guardrails, observability, and traceability; write runbooks."
                - listitem [ref=e68]: "Ship small apps: package prototypes behind simple APIs or lightweight UIs that field engineers can use (web chat, Slack/Teams bots, or CLI)."
                - listitem [ref=e69]: "Data plumbing: parse messy PDFs/images/CSVs; normalize schemas for recipes, events, alarms, SPC/trace data."
                - listitem [ref=e70]: Computer Vision – understanding, defect detection, segmentation, or SEM/optical imaging.
                - listitem [ref=e71]: "Work like an engineer: write readable Python/TypeScript, tests, and docs; use Git; participate in code reviews; iterate fast with the AI lead and domain SMEs."
              - strong [ref=e72]: Minimum Qualifications
              - list [ref=e73]:
                - listitem [ref=e74]: BS in CS/EE/CE/ME (or equivalent experience).
                - listitem [ref=e75]: Python proficiency (data wrangling, APIs, packaging); comfort on Linux and with Git.
                - listitem [ref=e76]: Built at least one LLM app using a framework such as LangChain, LlamaIndex, or Semantic Kernel.
                - listitem [ref=e77]: Hands-on with vector search (e.g., FAISS/Weaviate/Milvus) and embeddings; understands chunking, metadata, and hybrid search basics.
                - listitem [ref=e78]: Familiarity with RAG and prompt engineering; can measure quality (groundedness/relevance) and reduce hallucinations.
                - listitem [ref=e79]: Basic backend skills (REST/JSON, auth, environment secrets); experience containerizing with Docker.
                - listitem [ref=e80]: Comfortable reading technical manuals/logs and collaborating with non-software teammates.
              - text: Nice to haves
              - list [ref=e81]:
                - listitem [ref=e82]: Worked with agent frameworks (LangGraph, AutoGen, CrewAI) or implemented tool-calling/plan-execute loops.
                - listitem [ref=e83]: Built or configured MCP servers to connect LLMs to internal data/tools.
                - listitem [ref=e84]: Experience parsing complex docs (e.g., Unstructured, GROBID) and handling images/figures from manuals.
                - listitem [ref=e85]: Exposure to semiconductor equipment or factory systems (SECS/GEM, EDA/Interface A, MES, SPC); familiarity with KLA/AMAT/TEL/ASML tool ecosystems.
                - listitem [ref=e86]: Time-series and log analysis (Pandas, SQL, TimescaleDB/InfluxDB), wafer map/vision background, or simple CV.
                - listitem [ref=e87]: Model adaptation experience (LoRA/QLoRA, PEFT) and experiment tracking (MLflow/W&B).
                - listitem [ref=e88]: LLM observability/evals (Ragas, TruLens, LangSmith), basic security/PII handling, and role-based access.
                - listitem [ref=e89]: Cloud familiarity (AWS/Azure/GCP) and lightweight front-ends (React/Next.js) for internal tools.
                - listitem [ref=e90]: Prior work on fleet-level dashboards/analytics or recipe/parameter management.
              - text: What success looks like (first 90 days)
              - list [ref=e91]:
                - listitem [ref=e92]: Ship a search+chat knowledge assistant over our internal docs with clear eval dashboards for faithfulness/relevance.
                - listitem [ref=e93]: Stand up at least one MCP connector to an internal source (e.g., SharePoint/Confluence or log store) and demo safe tool calls.
                - listitem [ref=e94]: "Deliver a focused POC: e.g., an agent that reads recent alarms & logs to suggest next steps, or a fleet health summary with links to playbooks."
                - listitem [ref=e95]: Document everything (design notes, runbooks, and “how to” guides) and gather field feedback for iteration.
              - text: How we work
              - list [ref=e96]:
                - listitem [ref=e97]: Pragmatic, security-minded, iterate-in-the-open with our engineers.
                - listitem [ref=e98]: We value curiosity, clear writing, and the grit to trace weird edge cases in logs and manuals.
              - text: Apply
              - text: Send your resume/GitHub/portfolio and a short note about an LLM or agent project you’ve built (what made it work, what you measured, and what you’d improve).
              - strong [ref=e99]: Qualifications
              - text: see above
              - text: Onto Innovation Inc. offers competitive salaries and a generous benefits package, including health/dental/vision/life/disability, PTO, 401K plan with employer match, and an Employee Stock Purchase Program (ESPP) along with health & wellness initiatives. We provide a collaborative working environment along with resources, and state-of-the-art tools & equipment to promote success; and a welcoming, inclusive corporate culture where individuals are recognized for their contributions.
              - text: Onto Innovation Inc. is an Equal Opportunity Employer and all qualified applicants will receive consideration for employment without regard to race, color, religion, gender, sexual orientation, national origin, genetic information, age, disability, veteran status, or any other legally protected basis.
              - text: For positions requiring access to technical data, Onto Innovation Inc., Inc. may have to obtain export licensing approval from the U.S. Department of Commerce - Bureau of Industry and Security and/or the U.S. Department of State - Directorate of Defense Trade Controls. As such, applicants for this position – except US Citizens, US Permanent Residents, and protected individuals as defined by 8 U.S.C. 1324b(a)(3) – may have to go through an export licensing review process.
