            - generic [ref=e52]:
              - strong [ref=e53]: Job Details
              - text: "Job Description:"
              - strong [ref=e54]: The Role and Impact
              - text: As a Process Integration and Yield Engineer, you will play a pivotal role in shaping Intel's innovation and manufacturing excellence. This dynamic position focuses on driving technology transfers, optimizing manufacturing processes, and improving yield in a startup and high-volume production environment. Your contributions will directly support Intel's commitment to delivering industry-leading products. Working alongside internal and external stakeholders, you will have the opportunity to apply advanced data analysis techniques and influence technical directions across Intel and the industry.
              - strong [ref=e55]: Key Responsibilities
              - list [ref=e56]:
                - listitem [ref=e57]: Drive low yield analysis and yield improvement activities, collaborating with internal and external stakeholders. Define roadmaps to meet requirements, goals, and milestones for incoming technology transfers.
                - listitem [ref=e58]: Design and implement continuous improvement initiatives to prevent quality, line yield, and sort yield excursions.
                - listitem [ref=e59]: Develop and establish flow, procedures, and equipment configurations for process modules.
                - listitem [ref=e60]: Extract insights from both structured and unstructured data using statistical methods
                - listitem [ref=e61]: Conduct quality and reliability risk assessments for discrepant manufacturing materials and process changes.
                - listitem [ref=e62]: Lead quality and integrated defect and parametric measurement in startup and high-volume manufacturing environments.
                - listitem [ref=e63]: Serve as a domain expert, influencing technical direction across Intel and the industry while mentoring others and fostering technical community growth.
                - listitem [ref=e64]: Formulate and align organizational goals with technical vision, driving the execution of strategies to bring innovative products and technologies to market.
                - listitem [ref=e65]: Strong problem-solving skills and the ability to tackle complex technical challenges.
                - listitem [ref=e66]: Skilled in cross-functional collaboration and stakeholder management to drive impactful results.
                - listitem [ref=e67]: Proven track record of delivering innovative solutions and driving continuous improvement initiatives.
              - text: We invite you to bring your expertise, innovation, and drive to Intel, where your work will shape the future of technology. Apply today and become part of a team committed to excellence and innovation.
              - strong [ref=e68]: Qualifications
              - strong [ref=e69]: Minimum Qualifications
              - list [ref=e70]:
                - listitem [ref=e71]: 6+ years of experience with a Bachelor's degree or 4+ years of experience with a Master's degree, or 2+ years of experience with a PhD in chemical engineering, electrical engineering , computer science, physics, chemistry or relevant STEM degree.
                - listitem [ref=e72]: Experience in data mining and statistical analysis
                - listitem [ref=e73]: Experience in manufacturing process change, process characterization, and process integration.
                - listitem [ref=e74]: Experience with failure analysis, yield analysis, and process improvement methodologies.
              - strong [ref=e75]: Preferred Qualifications
              - text: "Experience in either of the following:"
              - list [ref=e76]:
                - listitem [ref=e77]: Lead technical projects and mentor team members effectively.
                - listitem [ref=e78]: Manufacturing processes to achieve world-class yield and quality standards.
              - strong [ref=e79]: Job Type
              - text: Experienced Hire
              - strong [ref=e80]: Shift
              - text: Shift 1 (United States of America)
              - text: "Primary Location:"
              - text: US, Oregon, Hillsboro
              - text: "Additional Locations:"
              - strong [ref=e81]: Business Group
              - text: Intel Foundry strives to make every facet of semiconductor manufacturing state-of-the-art while delighting our customers -- from delivering cutting-edge silicon process and packaging technology leadership for the AI era, enabling our customers to design leadership products, global manufacturing scale and supply chain, through the continuous yield improvements to advanced packaging all the way to final test and assembly. We ensure our foundry customers' products receive our utmost focus in terms of service, technology enablement and capacity commitments. Employees in the Foundry Technology Manufacturing are part of a worldwide factory network that designs, develops, manufactures, and assembly/test packages the compute devices to improve the lives of every person on Earth.
              - strong [ref=e82]: Posting Statement
              - text: All qualified applicants will receive consideration for employment without regard to race, color, religion, religious creed, sex, national origin, ancestry, age, physical or mental disability, medical condition, genetic information, military and veteran status, marital status, pregnancy, gender, gender expression, gender identity, sexual orientation, or any other characteristic protected by local law, regulation, or ordinance.
              - text: Position of Trust
              - text: N/A
              - strong [ref=e83]: Benefits
              - text: We offer a total compensation package that ranks among the best in the industry. It consists of competitive pay, stock bonuses, and benefit programs which include health, retirement, and vacation. Find out more about the benefits of working at Intel.
              - text: "Annual Salary Range for jobs which could be performed in the US: $120,860.00 - 231,670.00 USD"
              - text: The range displayed on this job posting reflects the minimum and maximum target compensation for the position across all US locations. Within the range, individual pay is determined by work location and additional factors, including job-related skills, experience, and relevant education or training. Your recruiter can share more about the specific compensation range for your preferred location during the hiring process.
              - strong [ref=e84]: Work Model for this Role
              - text: This role will be eligible for our hybrid work model which allows employees to split their time between working on-site at their assigned Intel site and off-site. * Job posting details (such as work model, location or time type) are subject to change.
              - text: "ADDITIONAL INFORMATION: Intel is committed to Responsible Business Alliance (RBA) compliance and ethical hiring practices. We do not charge any fees during our hiring process. Candidates should never be required to pay recruitment fees, medical examination fees, or any other charges as a condition of employment. If you are asked to pay any fees during our hiring process, please report this immediately to your recruiter."
