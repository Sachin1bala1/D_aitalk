              - text: .
              - paragraph
          - generic [ref=e131]:
            - heading "Responsibilities" [level=3] [ref=e132]
            - list [ref=e133]:
              - listitem [ref=e134]: Work with product leaders to understand objectives and formulate quantifiable business questions.
              - listitem [ref=e135]: Create and evaluate metrics to reflect the status of the business.
              - listitem [ref=e136]: Deliver insights into the data by creating workflows, colabs, dashboards and other visualizations.
              - listitem [ref=e137]: Partner with engineering teams to understand, design and improve data sources and applications.
              - listitem [ref=e138]: Perform analysis by utilizing relevant tools (e.g., SQL, R, Python). Use comprehensive technical knowledge, custom data infrastructure or existing data models.
