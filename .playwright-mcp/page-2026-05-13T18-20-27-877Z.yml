          - generic [ref=e126]:
            - heading "About the job" [level=3] [ref=e127]
            - text: Our team's mission is Data Science to support growing and running an efficient, reliable cloud. We focus primarily on the Google Compute Engine (GCE) and Vertex products. We are part of a larger Data Science organization that supports planning and analysis for Google's global infrastructure. We're excited and have some early successes bringing AI to our work.The US base salary range for this full-time position is $138,000-$198,000 + bonus + equity + benefits. Our salary ranges are determined by role, level, and location. Within the range, individual pay is determined by work location and additional factors, including job-related skills, experience, and relevant education or training. Your recruiter can share more about the specific salary range for your preferred location during the hiring process.
            - generic [ref=e129]:
              - text: Please note that the compensation details listed in US role postings reflect the base salary only, and do not include bonus, equity, or benefits. Learn more about
              - link "benefits at Google" [ref=e130] [cursor=pointer]:
