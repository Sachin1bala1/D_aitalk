            - generic [ref=e82]: Apply now
          - generic [ref=e84]: "As a Data Scientist at Meta, you will shape the future of people-facing and business-facing products we build across our entire family of applications (Facebook, Instagram, Messenger, WhatsApp, Oculus). By applying your technical skills, analytical mindset, and product intuition to one of the richest data sets in the world, you will help define the experiences we build for billions of people and hundreds of millions of businesses around the world. You will collaborate on a wide array of product and business problems with a wide-range of cross-functional partners across Product, Engineering, Research, Data Engineering, Marketing, Sales, Finance and others. You will use data and analysis to identify and solve product development's biggest challenges. You will influence product strategy and investment decisions with data, be focused on impact, and collaborate with other teams. By joining Meta, you will become part of a world-class analytics community dedicated to skill development and career growth in analytics and beyond. Product leadership: You will use data to shape product development, quantify new opportunities, identify upcoming challenges, and ensure the products we build bring value to people, businesses, and Meta. You will help your partner teams prioritize what to build, set goals, and understand their product's ecosystem. Analytics: You will guide teams using data and insights. You will focus on developing hypotheses and employ a varied toolkit of rigorous analytical approaches, different methodologies, frameworks, and technical approaches to test them. Communication and influence: You won't simply present data, but tell data-driven stories. You will convince and influence your partners using clear insights and recommendations. You will build credibility through structure and clarity, and be a trusted strategic partner."
          - separator [ref=e85]
          - generic [ref=e86]:
            - heading [level=2] [ref=e87]: Data Scientist, Product Analytics Responsibilities
            - list [ref=e88]:
              - generic [ref=e89]:
                - listitem [ref=e90]: Work with large and complex data sets to solve a wide array of challenging problems using different analytical and statistical approaches
                - listitem [ref=e91]: Apply technical expertise with quantitative analysis, experimentation, data mining, and the presentation of data to develop strategies for our products that serve billions of people and hundreds of millions of businesses
                - listitem [ref=e92]: Identify and measure success of product efforts through goal setting, forecasting, and monitoring of key product metrics to understand trends
                - listitem [ref=e93]: Define, understand, and test opportunities and levers to improve the product, and drive roadmaps through your insights and recommendations
                - listitem [ref=e94]: Partner with Product, Engineering, and cross-functional teams to inform, influence, support, and execute product strategy and investment decisions
          - generic [ref=e95]:
            - heading [level=2] [ref=e96]: Minimum Qualifications
            - list [ref=e97]:
              - generic [ref=e98]:
                - listitem [ref=e99]: Bachelor's degree in Computer Science, Computer Engineering, relevant technical field, or equivalent practical experience
                - listitem [ref=e100]: Bachelor's degree in Mathematics, Statistics, a relevant technical field, or equivalent
                - listitem [ref=e101]: 4+ years of work experience in analytics, data querying languages such as SQL, scripting languages such as Python, and/or statistical mathematical software such as R (minimum of 2 years with a Ph.D.)
                - listitem [ref=e102]: 4+ years of experience solving analytical problems using quantitative approaches, understanding ecosystems, user behaviors & long-term product trends, and leading data-driven projects from definition to execution [including defining metrics, experiment, design, communicating actionable insights]
          - generic [ref=e103]:
            - heading [level=2] [ref=e104]: Preferred Qualifications
            - list [ref=e105]:
