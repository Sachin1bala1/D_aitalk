      - generic [ref=e106]:
        - group "Summary" [ref=e107]:
          - complementary [ref=e108]:
            - heading "Summary" [level=2] [ref=e109]
            - generic [ref=e110]:
              - generic [ref=e111]:
                - text: "Posted:"
                - strong [ref=e112]:
                  - time [ref=e113]: Feb 12, 2026
              - generic [ref=e114]:
                - text: "Role Number:"
                - strong [ref=e115]: 200645796-0157
          - generic [ref=e117]: Imagine what you could do here! The people here at Apple don’t just create products — they build the kind of wonder that’s revolutionized entire industries. It’s the diversity of those people and their ideas that inspires the innovation that runs through everything we do, from amazing technology to industry-leading environmental efforts. At Apple, inclusion is a shared responsibility, and we work together to foster a culture where everyone belongs and is inspired to do their best work. Here on the Apple Store Online team, we are responsible for Apple’s largest store. Our main goal is to deliver a magical, personal digital experience where customers can shop, buy and learn everything Apple, wherever they are. Each customer should feel like they are our only customer and our job is to set the bar for the experience they receive. To run such an extraordinary store, it takes extraordinary people, and we are looking for someone to help us do extraordinary things. As a Data Scientist, you will provide data driven insights to fight fraud. You will develop models, evaluate product launches, develop automated solutions to deliver timely alerts, find opportunities for future development by applying the bleeding edge scientific methods. You will partner with engineers, product, program and business leaders alongside other teams to bring better experiences to drive meaningful customer impact.
        - group "Description" [ref=e118]:
          - complementary [ref=e119]:
            - heading "Description" [level=2] [ref=e120]
          - generic [ref=e122]: Research and develop evaluation methods to address fraud. Solve difficult, non-routine analysis problems by applying statistical, machine learning and advanced analytical methods as needed. - Design and execute observational and experimental studies of causal inference - Work with large, complex data sets. - Develop automated solutions to deliver insights and alerts - Drive feature evaluation and product roadmap with insights
        - group "Responsibilities" [ref=e123]:
          - complementary [ref=e124]:
            - heading "Responsibilities" [level=2] [ref=e125]
          - list [ref=e128]:
            - listitem [ref=e129]: Develop scalable data solutions to be used to drive analyses, reports, and insights
            - listitem [ref=e130]: Influence upstream data model design, drive KPI definitions and develop customized data solutions
            - listitem [ref=e131]: Measure impact of features and initiatives and help improve customer experience
            - listitem [ref=e132]: Collaborate and influence cross functional partners to help deliver product objectives on time
            - listitem [ref=e133]: Communicate results, insights and expectations to partners and senior leaders, bridge any gaps between technical and non-technical audiences. Be adept at messaging domain and technical content at a level appropriate for the audience.
            - listitem [ref=e134]: Work independently in sophisticated and highly visible projects, identify risks and develop frameworks, regularly connect with collaborators and leadership teams.
        - group "Minimum Qualifications" [ref=e135]:
          - complementary [ref=e136]:
            - heading "Minimum Qualifications" [level=2] [ref=e137]
          - list [ref=e140]:
            - listitem [ref=e141]: Masters in Statistics, Mathematics, Data Science, Machine Learning, Physics, Engineering, Computer Science or equivalent
            - listitem [ref=e142]: Proficiency in data querying using SQL, Spark, or equivalent technologies
            - listitem [ref=e143]: "Proficiency in scripting languages for data processing and analysis (ex: Python, R, or Scala)"
            - listitem [ref=e144]: Excellent communication and multi-functional collaboration skills, ability to convey complex concepts to diverse audiences
            - listitem [ref=e145]: At least 3 years experience working as a Data Scientist
        - group "Preferred Qualifications" [ref=e146]:
          - complementary [ref=e147]:
            - heading "Preferred Qualifications" [level=2] [ref=e148]
          - list [ref=e151]:
            - listitem [ref=e152]: PhD in Statistics, Mathematics, Data Science, Machine Learning, Physics, Engineering, Computer Science or equivalent
            - listitem [ref=e153]: Experience applying LLMs to solve technical problems such as data analysis, data automation, synthetic data generation with proven ability to optimize model performance for accuracy and efficiency
            - listitem [ref=e154]: Excellent product intuition, keen eye for design and customer pain point awareness
            - listitem [ref=e155]: Experience developing anomaly detection and causal inference models
