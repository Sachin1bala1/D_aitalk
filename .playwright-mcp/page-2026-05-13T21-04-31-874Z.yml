      - generic [ref=e113]:
        - paragraph [ref=e114]:
          - text: Apple is an equal opportunity employer that is committed to inclusion and diversity. We seek to promote equal opportunity for all applicants without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, disability, Veteran status, or other legally protected characteristics.
          - link "Learn more about your EEO rights as an applicant (Opens in a new window)" [ref=e115] [cursor=pointer]:
            - /url: https://www.eeoc.gov/sites/default/files/2023-06/22-088_EEOC_KnowYourRights6.12ScreenRdr.pdf
            - text: Learn more about your EEO rights as an applicant
            - generic [ref=e116]: (Opens in a new window)
          - text: .
        - paragraph [ref=e117]: Apple will not discriminate or retaliate against applicants who inquire about, disclose, or discuss their compensation.
        - paragraph [ref=e118]:
          - text: Apple participates in the E-Verify program in certain locations as required by law.
          - link "Learn more about the E-Verify program" [ref=e119] [cursor=pointer]:
            - /url: https://www.apple.com/careers/pdf/EverifyPosterEnglish.pdf
          - text: .
        - paragraph [ref=e120]:
          - text: Apple is committed to working with and providing reasonable accommodation to applicants with physical and mental disabilities.
          - link "Reasonable Accommodation and Drug Free Workplace policy Learn more (Opens in a new window)" [ref=e121] [cursor=pointer]:
            - /url: https://www.apple.com/careers/us/accommodation_drugfree.html
            - generic [ref=e122]: Reasonable Accommodation and Drug Free Workplace policy
            - text: Learn more
            - generic [ref=e123]: (Opens in a new window)
          - text: .
        - paragraph [ref=e124]:
          - text: Apple is a drug-free workplace.
          - link "Reasonable Accommodation and Drug Free Workplace policy Learn more (Opens in a new window)" [ref=e125] [cursor=pointer]:
            - /url: https://www.apple.com/careers/us/accommodation_drugfree.html
            - generic [ref=e126]: Reasonable Accommodation and Drug Free Workplace policy
            - text: Learn more
            - generic [ref=e127]: (Opens in a new window)
          - text: .
        - paragraph [ref=e128]:
          - text: Apple will consider for employment all qualified applicants with criminal histories in a manner consistent with applicable law. If you’re applying for a position in San Francisco, review the
          - link "San Francisco Fair Chance Ordinance guidelines (opens in a new window)" [ref=e129] [cursor=pointer]:
            - /url: https://www.sf.gov/sites/default/files/2022-12/FCO%20poster2020_0.pdf
            - generic [ref=e130]: San Francisco Fair Chance Ordinance
            - text: guidelines
            - generic [ref=e131]: (opens in a new window)
          - text: applicable in your area.
        - paragraph [ref=e132]: It is unlawful in Massachusetts to require or administer a lie detector test as a condition of employment or continued employment. An employer who violates this law shall be subject to criminal penalties and civil liability.
