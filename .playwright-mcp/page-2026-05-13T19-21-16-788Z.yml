              - generic:
                - generic:
                  - generic: Cover letter
              - textbox "Cover letter" [ref=e1864]: "I'm a manufacturing process development engineer based in Austin with 3+ years at Tesla, and the responsibilities listed in this posting match what I do day-to-day: DFM feasibility reviews, PFMEA with RPN reduction targets, vendor capability assessments, run-at-rate validation, and 8D root cause investigations closed with documented Cpk improvement. The Austin location is a strong pull for me — I've built my career here and want to continue at that level. At Tesla, I've led process development from early experimentation through production transfer on multiple programs. That includes generating DFM feasibility reports to flag design issues before freeze, executing process capability audits (targeting Cpk >1.33) during pilot phases, and running structured 8D investigations that trace failure modes across supplier data, equipment logs, and process history. When I find a root cause, I close the loop with a corrective action, updated control plan, and a follow-up capability check — not just a report. On the supply chain side, I've conducted vendor assessments and factory readiness gap analyses, developed process flow diagrams and material presentation plans to streamline parts flow to the line, and standardized these workflows across multiple Tesla sites. I use JMP heavily for Pareto analysis, SPC, and Gage R&R; Python for data pipelines and automated reporting. I also built open-source tooling for DOE workflow automation that engineers actually use (github.com/sachin1bala1/engineering-data-agent). I hold a Six Sigma Yellow Belt and am actively working toward Black Belt. My degree is Mechanical Engineering (BS, Western Michigan, GPA 3.69). The five-year requirement is a stretch given my 3+ years of industry experience, but the depth of work I've done in that time — owning full process development cycles, not just supporting them — is closer to what the role actually needs than time-in-seat would suggest. I currently require visa sponsorship (OPT, will need H-1B). I'd prefer the Austin location. Happy to discuss specific examples from any of the responsibilities listed — I have concrete stories for each of them. Best, Sachin Bala"
            - paragraph [ref=e1866]: Optional
