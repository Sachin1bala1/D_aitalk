                          - text: "Katherine.Tempel@cybercoders.com Looking forward to receiving your resume through our website and going over the position with you. Clicking apply is the best way to apply. Please do NOT change the email subject line in any way. You must keep the JobID: linkedin : KT4-1984066 -- in the email subject line for your application to be considered. Katherine Tempel - Recruiting Manager For this position, you must be currently authorized to work in the United States without the need for sponsorship for a non-immigrant visa. This is a new role. CyberCoders will consider for Employment in the City of Los Angeles qualified Applicants with Criminal Histories in a manner consistent with the requirements of the Los Angeles Fair Chance Initiative for Hiring (Ban the Box) Ordinance. This job was first posted by CyberCoders on 04/16/2026 and applications will be accepted on an ongoing basis until the position is filled or closed."
