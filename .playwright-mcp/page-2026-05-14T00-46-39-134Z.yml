                      - generic [ref=f205e325]:
                        - paragraph [ref=f205e326]:
                          - strong [ref=f205e328]: Manufacturing Engineer
                          - strong [ref=f205e330]: Position Overview
                          - text: We are seeking a Manufacturing Engineer to develop, optimize, and sustain production equipment and processes for vacuum and semiconductor-related manufacturing. The role focuses on designing and qualifying equipment (including vacuum chambers), improving manufacturability and throughput, ensuring compliance with NRTL and SEMI S2/S8 safety standards, and collaborating with cross-functional teams to bring robust, production-ready systems online.
                          - strong [ref=f205e332]: Key Responsibilities
                          - list [ref=f205e334]:
                            - listitem [ref=f205e335]: Design, develop, and validate manufacturing equipment and fixtures with emphasis on vacuum systems and vacuum chambers.
                            - listitem [ref=f205e336]: Create detailed mechanical and cable designs and producibility documentation to support manufacturing and assembly.
                            - listitem [ref=f205e337]: Perform finite element analysis (FEA) and other engineering studies to ensure structural integrity and performance of equipment.
                            - listitem [ref=f205e338]: Develop and maintain control logic interfaces and work with PLC engineers to integrate automation with production equipment.
                            - listitem [ref=f205e339]: Lead design for compliance with safety and certification standards (NRTL, SEMI S2/S8) and prepare documentation for safety reviews and audits.
                            - listitem [ref=f205e340]: Work with suppliers and internal teams to source components, perform incoming inspections, and resolve manufacturing issues.
                            - listitem [ref=f205e341]: Drive continuous improvement initiatives to reduce cost, increase yield, and improve equipment uptime and serviceability.
                            - listitem [ref=f205e342]: Prepare work instructions, bills of materials, and production validation plans; support installation, commissioning, and field support activities.
                          - strong [ref=f205e344]: Qualifications
                          - list [ref=f205e346]:
                            - listitem [ref=f205e347]: Bachelors degree in Mechanical, Manufacturing, Electrical Engineering, or related field required; Masters degree preferred.
                            - listitem [ref=f205e348]: 3+ years of experience in manufacturing engineering, equipment design, or a related role, preferably in vacuum systems or semiconductor equipment.
                            - listitem [ref=f205e349]: Hands-on experience with vacuum systems and vacuum chamber design and commissioning.
                            - listitem [ref=f205e350]: Proven experience with equipment design, cable design, and creating manufacturable assemblies and documentation.
                            - listitem [ref=f205e351]: Familiarity with safety and certification processes including NRTL and SEMI S2/S8 standards.
                            - listitem [ref=f205e352]: Experience with PLC integration and control system coordination with manufacturing equipment.
                            - listitem [ref=f205e353]: Proficiency in FEA tools (ANSYS, SolidWorks Simulation, or equivalent) and CAD software (SolidWorks, Creo, etc.).
                            - listitem [ref=f205e354]: Strong problem-solving skills, excellent written and verbal communication, and experience working in cross-functional teams.
                            - listitem [ref=f205e355]: Ability to travel for supplier visits, installations, and field support as needed.
