name: validate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
      - "integration/**"
      - "feature/**"
  push:
    branches:
      - main
      - "integration/**"
      - "feature/**"
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm exec tsc -- --noEmit

      - name: Frontend build
        run: npm run build

  rust:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: C:\cargo-target\daitalk-check
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        shell: powershell
        run: npm ci

      - name: Install Rust stable
        shell: powershell
        run: |
          rustup update stable
          rustup default stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc

      - name: Install Windows build prerequisites
        shell: powershell
        run: |
          choco install strawberryperl -y --no-progress
          $perlBin = @(
            "C:\Strawberry\perl\bin",
            "$env:ChocolateyInstall\lib\strawberryperl\tools\perl\bin"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $perlBin) {
            throw "Perl install path not found after installing strawberryperl."
          }

          $perlExe = Join-Path $perlBin "perl.exe"
          if (-not (Test-Path $perlExe)) {
            throw "perl.exe not found at $perlExe"
          }

          $perlBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $perlExe -v

      - name: Install WebView2
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebView2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/silent", "/install" -Wait

      - name: Verify Windows toolchain
        shell: powershell
        run: |
          rustup show
          cargo -Vv
          rustc -Vv
          where.exe link
          where.exe cl
          Write-Host "CARGO_TARGET_DIR=$env:CARGO_TARGET_DIR"

      - name: Cargo check
        working-directory: src-tauri
        shell: powershell
        run: cargo check -vv
