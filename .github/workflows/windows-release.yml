name: windows-release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-2025-vs2026
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}\daitalk-release-target
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        shell: powershell
        run: |
          rustup update stable
          rustup default stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc

      - name: Setup MSVC developer shell
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found at $vswhere"
          }

          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw "Visual Studio Build Tools installation path not found."
          }

          $vsDevCmd = Join-Path $installPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat not found at $vsDevCmd"
          }

          $envDump = Join-Path $env:RUNNER_TEMP "vsdevcmd-env.txt"
          cmd /c "`"$vsDevCmd`" -arch=x64 -host_arch=x64 >nul && set" | Set-Content -Path $envDump

          Get-Content $envDump | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              $value = $matches[2]
              if ($name -eq "PATH") {
                $value | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              } else {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }

      - name: Install Windows build prerequisites
        shell: powershell
        run: |
          choco install strawberryperl -y --no-progress
          $perlBin = @(
            "C:\Strawberry\perl\bin",
            "$env:ChocolateyInstall\lib\strawberryperl\tools\perl\bin"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $perlBin) {
            throw "Perl install path not found after installing strawberryperl."
          }

          $perlExe = Join-Path $perlBin "perl.exe"
          if (-not (Test-Path $perlExe)) {
            throw "perl.exe not found at $perlExe"
          }

          $perlBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $perlExe -v

      - name: Install WebView2
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebView2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/silent", "/install" -Wait

      - name: Verify toolchain
        shell: powershell
        run: |
          rustup show
          cargo --version
          rustc --version
          npm --version
          $linkCmd = Get-Command link.exe -ErrorAction SilentlyContinue
          if ($linkCmd) {
            Write-Host "link.exe=$($linkCmd.Source)"
          } else {
            Write-Warning "link.exe not found on PATH"
          }

          $clCmd = Get-Command cl.exe -ErrorAction SilentlyContinue
          if ($clCmd) {
            Write-Host "cl.exe=$($clCmd.Source)"
          } else {
            Write-Warning "cl.exe not found on PATH"
          }

          Write-Host "CARGO_TARGET_DIR=$env:CARGO_TARGET_DIR"

      - name: Install frontend dependencies
        shell: powershell
        run: npm ci

      - name: Build unsigned bundle
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\windows-secure-build.ps1 -SkipNpmInstall -SkipLint

      - name: Check signing secret availability
        id: signing_check
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_SIGN_CERT_SHA1: ${{ secrets.WINDOWS_SIGN_CERT_SHA1 }}
        run: |
          $enabled =
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64) -and
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD) -and
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_CERT_SHA1)

          if ($enabled) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Signing secrets not fully configured; continuing with unsigned artifacts."
          }

      - name: Import signing certificate
        if: github.ref_type == 'tag' && steps.signing_check.outputs.enabled == 'true'
        shell: powershell
        run: |
          $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_BASE64 }}")
          $certPath = Join-Path $env:RUNNER_TEMP "daitalk-release-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERT_PASSWORD }}" -AsPlainText -Force) | Out-Null

      - name: Sign Windows artifacts
        if: github.ref_type == 'tag' && steps.signing_check.outputs.enabled == 'true'
        shell: powershell
        env:
          WINDOWS_SIGN_CERT_SHA1: ${{ secrets.WINDOWS_SIGN_CERT_SHA1 }}
        run: |
          .\scripts\sign-windows-artifacts.ps1 -CargoTargetDir $env:CARGO_TARGET_DIR

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daitalk-windows-bundle
          path: |
            ${{ env.CARGO_TARGET_DIR }}\release\bundle\**\*.exe
            ${{ env.CARGO_TARGET_DIR }}\release\bundle\**\*.msi
